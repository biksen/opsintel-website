# nginx server block for opsintels.com — the always-on landing page.
# certbot --nginx adds the 443 block + http->https redirect automatically.
server {
    listen 80;
    server_name opsintels.com www.opsintels.com;

    root /var/www/opsintels;
    index index.html;

    # Contact form handler (the opsintel-contact service on 127.0.0.1:8100).
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for the immutable asset; the HTML itself stays fresh.
    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
